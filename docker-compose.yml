# Cara cepat coba tanpa Neon: postgres lokal + backend + frontend.
#   docker compose up --build
# Backend: http://localhost:3001 — Frontend: http://localhost:5173
# Skema + seed otomatis dimuat saat postgres pertama kali dibuat (lihat ./backend/*.sql).
# Rate-limit backend in-memory: cukup untuk single-instance study case.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laporan
      POSTGRES_PASSWORD: laporan
      POSTGRES_DB: laporan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laporan -d laporan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://laporan:laporan@db:5432/laporan?sslmode=disable
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:80"

volumes:
  pgdata:

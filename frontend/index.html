<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Dashboard Laporan Lapangan — kelola, tinjau, dan pantau laporan lapangan dalam satu tempat."
    />
    <meta name="theme-color" content="#f1f4f3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Terapkan tema sebelum React render agar tidak berkedip (flash) saat memuat halaman.
      (function () {
        try {
          var saved = localStorage.getItem("laporan-lapangan-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0a1314" : "#f1f4f3");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Laporan Lapangan — Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

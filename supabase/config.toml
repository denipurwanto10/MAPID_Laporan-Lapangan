# Konfigurasi lokal untuk Supabase CLI.
# Dipakai hanya saat menjalankan `supabase start` (stack lokal via Docker).
# Untuk deploy ke hosting, bagian [functions] di bawah tetap dipakai CLI.

project_id = "mapid-laporan"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[functions.bulk-status]
verify_jwt = false

[functions.export-xlsx]
verify_jwt = false